<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkProof · 文档记录</title><style>body{margin:0;background:#141d17;color:#dce9df;font:14px/1.8 'Segoe UI','Microsoft YaHei',sans-serif;padding:24px}h1{font-size:25px;font-weight:500}small,p{color:#9ab4a2}button{width:100%;padding:12px;margin:8px 0;border:1px solid #50765b;border-radius:7px;background:#b8dcbc;color:#1c3524;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible{outline:2px solid white;outline-offset:3px}#status{min-height:90px;border:1px solid #34553f;border-radius:8px;padding:15px;margin:20px 0;font-size:12px;overflow-wrap:anywhere}footer{margin-top:25px;font-size:11px;color:#92aa99}</style><small>WORKPROOF / PROCESS RECORD</small><h1>让过程，有据可查。</h1><p id="host">正在检测宿主…</p><div id="status" role="status">正在准备。</div><button id="start" disabled>开始记录当前文档</button><button id="pause" disabled>暂停记录</button><button id="export" disabled>导出交付件与证书</button><p><span id="count">0</span> 条已持久化事件</p><footer>仅保存文档统计与修改信号，不保存文字历史。不认证人类身份，不推断 AI 比例。关闭任务窗会结束本次采集，未提交队列可能丢失。采样统计无法还原两次采样之间的全部编辑。</footer><script src="addin.js"></script></html>
