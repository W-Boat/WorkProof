<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkProof · 文档记录</title><style>body{margin:0;background:#141d17;color:#dce9df;font:14px/1.8 'Segoe UI','Microsoft YaHei',sans-serif;padding:24px}h1{font-size:25px;font-weight:500}small,p{color:#9ab4a2}button{width:100%;padding:12px;margin:8px 0;border:1px solid #50765b;border-radius:7px;background:#b8dcbc;color:#1c3524;font:inherit;cursor:pointer}a.download-link{display:block;padding:12px;margin:8px 0;border:1px solid #50765b;border-radius:7px;color:#b8dcbc;text-align:center;text-decoration:none}a.download-link:focus-visible{outline:2px solid white;outline-offset:3px}#delivery{border-top:1px solid #34553f;margin-top:20px;padding-top:12px}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible{outline:2px solid white;outline-offset:3px}#status{min-height:90px;border:1px solid #34553f;border-radius:8px;padding:15px;margin:20px 0;font-size:14px;overflow-wrap:anywhere}footer{margin-top:25px;font-size:13px;color:#92aa99}</style><small>WORKPROOF · 创作过程记录</small><h1>记录这份文档的创作过程</h1><p id="host">正在识别你使用的软件…</p><div id="status" role="status">正在准备。</div><ol aria-label="文档记录的三个步骤"><li>点击开始，回到 WorkProof 窗口允许连接。</li><li>正常编辑文档；需要休息时可暂停记录。</li><li>完成后导出作品和证书，将这两个文件一起交付。</li></ol><button id="start" disabled>开始记录当前文档</button><button id="cancel-pairing" hidden>取消连接</button><button id="pause" disabled>暂停记录</button><button id="export" disabled>导出作品和证书</button><section id="delivery" aria-label="保存本次交付文件" hidden><p>请分别保存这两个文件，再确认下载位置。页面无法确认它们是否已成功保存。</p><a id="save-artifact" class="download-link">保存作品</a><a id="save-proof" class="download-link">保存证书</a></section><p><span id="count">0</span> 次操作已保存</p><footer>只保存文字数量等过程记录，不保存文档正文。这些记录不能证明作者身份或原创性，也不能判断用了多少 AI。关闭此面板会停止记录，尚未保存的操作可能丢失。短时间内的多次修改可能合并为一条记录。</footer><script src="addin.js"></script></html>
