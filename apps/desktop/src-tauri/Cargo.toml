[package]
name = "workproof-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
workproof-engine = { path = "../../../crates/engine" }
tokio = { version = "1", features = ["rt-multi-thread"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
serde_json = "1"


[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT"] }
