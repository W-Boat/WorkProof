[package]
name = "workproof-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
workproof-engine = { path = "../../../crates/engine" }
tokio = { version = "1", features = ["rt-multi-thread"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }

