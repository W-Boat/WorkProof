<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkProof</title><style>body{margin:0;background:#141917;color:#e5ece8;font:14px/1.8 'Segoe UI','Microsoft YaHei',sans-serif;padding:30px}small{color:#8caaa0;letter-spacing:2px}h1{font-size:28px;margin:18px 0}p{color:#aabbb2}ol{padding-left:20px}li{margin:16px 0}.badge{border:1px solid #345346;background:#20382e;padding:8px 12px;color:#9fdfbc;border-radius:8px}footer{margin-top:26px;font-size:11px;color:#85998d}</style><small>WORKPROOF / LOCAL ENGINE</small><h1>让过程，有据可查。</h1><div class="badge">本地引擎 · 托盘常驻</div><ol><li>在 VS Code 中安装 WorkProof 扩展。</li><li>运行「WorkProof: 配对本地引擎」。</li><li>打开文件，选择「记录当前文件」。</li><li>完成后导出 .wproof，与作品一起交付。</li></ol><p>仅在主动开启后采集。不录屏，不保存文字内容。关闭此窗口仍可记录。</p><footer>记录不等于人类身份认证。退出托盘引擎会中断接收。</footer></html>
