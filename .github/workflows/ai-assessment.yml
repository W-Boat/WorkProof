name: Optional AI reference model
on:
  push:
    paths: ['tools/ai-assessment/detector.py', 'tools/ai-assessment/desklib_backend.py', 'tools/ai-assessment/documents.py', 'tools/ai-assessment/engines.json', 'tools/ai-assessment/requirements.txt', 'tools/ai-assessment/test_real.py', 'tools/ai-assessment/test_documents.py', 'tools/ai-assessment/collect_notices.py', 'tools/ai-assessment/test_collect_notices.py', 'docs/licenses/ai-runtime/**', 'services/institution/**/AiAnalysisService*.java', '.github/workflows/ai-assessment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-model:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: ['mpu-en-v3', 'mpu-zh-v3', 'desklib-en-v1.01']
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      WORKPROOF_TEST_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated CPU runtime
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r tools/ai-assessment/requirements.txt
          pip check
      - name: Explicitly prepare pinned public reference weights
        run: python tools/ai-assessment/detector.py prepare --model-dir /tmp/workproof-ai-model --engine "$WORKPROOF_TEST_ENGINE"
      - name: Real offline inference and unsupported-input handling
        # Extraction never starts Office or follows relationships.
        # Synthetic OOXML fixtures do not substitute for real-host acceptance.
        run: python tools/ai-assessment/test_real.py
      - name: Document extraction and hostile OOXML boundaries
        run: python tools/ai-assessment/test_documents.py
      - name: Record installed runtime licenses
        run: |
          pip inspect > ai-runtime-inventory.json
          python tools/ai-assessment/test_collect_notices.py
          python tools/ai-assessment/collect_notices.py --output ai-runtime-notices
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('ai-runtime-notices')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['commercial_clearance'] is False
          names={package['name'].lower() for package in manifest['packages']}
          assert {'torch','transformers','safetensors','tokenizers'} <= names
          assert next(package['version'] for package in manifest['packages'] if package['name'].lower()=='tokenizers')=='0.23.3'
          count=0
          for package in manifest['packages']:
              for item in package['files']:
                  source=pathlib.PurePosixPath(item['source'])
                  assert not source.is_absolute() and '..' not in source.parts and ':' not in str(source)
                  raw=(root/item['archive']).read_bytes()
                  assert len(raw)==item['bytes'] and hashlib.sha256(raw).hexdigest()==item['sha256']
                  count+=1
          assert count>0
          print('Verified installed notice hashes:',count,'; unresolved packages:',sum(bool(p['issues']) for p in manifest['packages']))
          supplement=pathlib.Path('docs/licenses/ai-runtime/tokenizers-0.23.3')
          evidence=json.loads((supplement/'source.json').read_text(encoding='utf-8'))
          assert evidence['commercial_clearance'] is False and evidence['installed_wheel_notice_missing'] is True
          assert hashlib.sha256((supplement/'LICENSE').read_bytes()).hexdigest()==evidence['license_sha256']
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Institution service with actual Python and pinned model
        env:
          WORKPROOF_REAL_AI_ENGINE: ${{ matrix.engine }}
        run: |
          export WORKPROOF_REAL_AI_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export WORKPROOF_REAL_AI_SCRIPT="$GITHUB_WORKSPACE/tools/ai-assessment/detector.py"
          cd services/institution/scaffold-system
          mvn -B -pl scaffold-system -am -Dtest=AiAnalysisServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-reference-validation-${{ matrix.engine }}
          path: |
            ai-reference-results.json
            ai-document-results.json
            ai-runtime-inventory.json
            ai-runtime-notices/
            docs/licenses/ai-runtime/
            services/institution/scaffold-system/scaffold-system/target/surefire-reports/*AiAnalysisServiceTest*.xml
            /tmp/workproof-ai-model/workproof-model.json
