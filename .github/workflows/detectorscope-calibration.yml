name: Independent DetectorScope bilingual calibration and heldout evaluation
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/detectorscope-calibration.yml']
permissions:
  contents: read
  actions: read
jobs:
  heldout:
    runs-on: ubuntu-24.04
    timeout-minutes: 275
    strategy:
      fail-fast: false
      matrix:
        language: [en, zh]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate the original completed calibration and frozen policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/ai-assessment/test_resume_detectorscope.py
          python tools/ai-assessment/test_audit_detectorscope.py
          python tools/ai-assessment/resume_detectorscope.py fetch --language "${{ matrix.language }}" --checkpoint "$RUNNER_TEMP/detectorscope-checkpoint"
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/detectorscope
          ref: 52ecc87775154b35d4550911de22faad4fc68f40
          path: .detectorscope-source
          persist-credentials: false
      - name: Prepare isolated CPU runtime
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.22.1 tokenizers==0.23.3 huggingface-hub==2.4.0 safetensors==0.8.0 setuptools==80.9.0
          python -m pip install --no-deps --no-build-isolation ./.detectorscope-source
          python -m pip check
      - name: Reconstruct frozen data without score-based selection
        run: python tools/ai-assessment/prepare_detectorscope_data.py --output "$RUNNER_TEMP/workproof-detectorscope-inputs"
      - name: Verify original and derived model bytes
        run: python tools/ai-assessment/detectorscope_experiment.py --prepare-only
      - name: Score the assigned frozen heldout samples
        run: |
          python tools/ai-assessment/resume_detectorscope.py score \
            --checkpoint "$RUNNER_TEMP/detectorscope-checkpoint" \
            --inputs "$RUNNER_TEMP/workproof-detectorscope-inputs" \
            --model-dir "$RUNNER_TEMP/workproof-detectorscope-float16-derivative" \
            --output heldout-shard --language "${{ matrix.language }}" --shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        with:
          name: detectorscope-heldout-${{ matrix.language }}-${{ matrix.shard }}
          path: heldout-shard/
          if-no-files-found: error
  assemble:
    needs: heldout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        language: [en, zh]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: detectorscope-heldout-${{ matrix.language }}-*
          path: heldout-parts/
      - name: Verify historical policy and assemble the complete language report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/ai-assessment/resume_detectorscope.py fetch --language "${{ matrix.language }}" --checkpoint "$RUNNER_TEMP/detectorscope-checkpoint"
          python tools/ai-assessment/resume_detectorscope.py assemble --language "${{ matrix.language }}" \
            --checkpoint "$RUNNER_TEMP/detectorscope-checkpoint" --parts heldout-parts --output evaluation
      - uses: actions/upload-artifact@v4
        with:
          name: detectorscope-independent-${{ matrix.language }}
          path: evaluation/
          if-no-files-found: error
