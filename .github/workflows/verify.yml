name: Build and verify WorkProof
on:
  push:
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/native-webview.yml'
      - 'tools/ai-assessment/**'
      - '.github/workflows/ai-evaluation.yml'
      - '.github/workflows/ai-benchmark.yml'
      - '.github/workflows/ai-assessment.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      web_only:
        description: 'Run shared protocol and browser checks without desktop packaging'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: workproof-${{ github.ref }}${{ inputs.web_only && '-web' || '' }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  windows-resources:
    if: ${{ inputs.web_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-offline-resources
      - run: npm ci
      - uses: ./.github/actions/protocol-browser-resource
      - uses: ./.github/actions/c2pa-browser-resource
      - name: Build the exact-source offline site and VS Code package
        run: |
          node apps/office/build.mjs
          mkdir -p apps/verifier/public/office
          cp -r apps/office/dist/* apps/verifier/public/office/
          npm run build:web
          npm run build:extension
          npm run package -w workproof-vscode
          python -c "import json,os,pathlib;pathlib.Path('windows-offline-source.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA']}),encoding='utf-8')"
      - uses: actions/upload-artifact@v4
        with:
          name: workproof-windows-offline-resources
          include-hidden-files: true
          if-no-files-found: error
          path: |
            apps/verifier/out/
            apps/extension/*.vsix
            windows-offline-source.json
  protocol-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Protocol tests
        run: cargo test --locked -p workproof-protocol -p workproof-engine
      - uses: ./.github/actions/protocol-browser-resource
      - name: Build and exercise local collector
        env:
          WORKPROOF_WORD_REVISION_FIXTURE: ${{ runner.temp }}/word-revision.wproof
        run: |
          cargo build -p workproof-engine
          python scripts/test_engine.py target/debug/workproof-engine
      - name: Cross-adapter state location policy
        run: |
          cargo build --locked -p workproof-engine --example data_location
          node scripts/test_locations.cjs target/debug/examples/data_location
      - name: Independent Merkle and selective proof interoperability
        run: node scripts/test_disclosure.cjs target/debug/workproof-engine
      - name: Certificate-only inspection without artifact access
        run: node scripts/test_certificate_inspection.cjs target/debug/workproof-engine target/debug/workproof-inspector
      - name: Real RFC 3161 exchange with a synthetic test authority
        run: python scripts/test_timestamp.py target/debug/workproof-timestamp
      - run: npm run typecheck
      - run: npm run build:extension
      - name: Typecheck and bundle Word/WPS add-in
        run: |
          npx tsc -p apps/office/tsconfig.json --noEmit
          node apps/office/build.mjs
          mkdir -p apps/verifier/public/office
          cp -r apps/office/dist/* apps/verifier/public/office/
      - name: WPS ribbon lifecycle and origin isolation
        run: node --test scripts/test_wps_ribbon.cjs
      - name: Photoshop UXP controller and native grant integration
        run: |
          node --test scripts/test_photoshop.cjs
          node apps/photoshop/build.mjs
          cargo build --locked -p workproof-engine --example native_adapter_harness
          node scripts/test_photoshop_engine.cjs target/debug/examples/native_adapter_harness target/debug/workproof-engine
          python scripts/package_photoshop.py
      - name: Extension to collector integration
        run: node scripts/test_extension.cjs target/debug/workproof-engine
      - name: Install Blender for native adapter validation
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Package Blender extension for native acceptance
        run: python scripts/package_blender.py
      - uses: ./.github/actions/blender-extension-acceptance
      - run: npm run package -w workproof-vscode
      - uses: ./.github/actions/c2pa-browser-resource
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - name: Bundle the same offline Fluent desktop components before browser checks
        run: node scripts/stage_desktop_ui.cjs
      - name: Browser verification and screenshots
        env:
          WORKPROOF_WORD_REVISION_FIXTURE: ${{ runner.temp }}/word-revision.wproof
        run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: |
            test-results/
            playwright-report/
            test-engine-results.json
            test-blender-results.json
            test-photoshop-results.json
            .ci-blender-evolution/scene.blend
            .ci-blender-evolution/scene.blend.wproof
            .ci-blender-evolution/scene.blend.wgraph
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: workproof-web-and-extension
          include-hidden-files: true
          path: |
            apps/verifier/out/
            apps/extension/*.vsix
            apps/office/dist/
            dist/workproof-blender-*.zip
            dist/workproof-photoshop-*-dev.zip
            docs/
            README.md
            Cargo.lock
  windows-desktop:
    if: ${{ inputs.web_only != true }}
    # Packaging may proceed while full browser/Blender acceptance runs. A green
    # Windows package does not turn the overall workflow green if those fail.
    needs: windows-resources
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: ./.github/actions/c2pa-resource
      - uses: actions/download-artifact@v4
        with:
          name: workproof-windows-offline-resources
          path: .ci-artifacts
      - name: Prepare bundled verifier and extension
        shell: pwsh
        run: |
          $provenance=Get-Content -LiteralPath .ci-artifacts/windows-offline-source.json -Raw | ConvertFrom-Json
          if($provenance.source_commit -ne $env:GITHUB_SHA){throw 'Offline resources are not from this source commit'}
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/resources | Out-Null
          Copy-Item -Recurse .ci-artifacts/apps/verifier/out apps/desktop/src-tauri/resources/verifier
          Copy-Item .ci-artifacts/apps/extension/*.vsix apps/desktop/src-tauri/resources/workproof.vsix
          npm run icons -w @workproof/desktop
      - run: cargo test --locked -p workproof-protocol -p workproof-engine
      - name: Windows state location and desktop integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          cargo build --locked -p workproof-engine --example data_location
          node scripts/test_locations.cjs target/debug/examples/data_location.exe
          rustc --test apps/desktop/src-tauri/src/platform.rs -o "$env:RUNNER_TEMP/workproof-platform-tests.exe"
          & "$env:RUNNER_TEMP/workproof-platform-tests.exe"
      - run: cargo build --locked -p workproof-engine --release
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build 32-bit Office first-install payloads
        shell: pwsh
        run: |
          ./apps/word-native-cpp/build.ps1 -Architecture x86 -OutDir apps/word-native-cpp/out-x86
          ./apps/word-native-cpp/build.ps1 -Architecture x86 -PowerPoint -OutDir apps/word-native-cpp/out-powerpoint-x86
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build 64-bit Office first-install payloads
        shell: pwsh
        run: |
          ./apps/word-native-cpp/build.ps1 -Architecture x64 -OutDir apps/word-native-cpp/out
          ./apps/word-native-cpp/build.ps1 -Architecture x64 -PowerPoint -OutDir apps/word-native-cpp/out-powerpoint
      - name: Collect original Office payload notices
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          cargo fetch --locked --target x86_64-pc-windows-msvc
          python scripts/word_package_notices.py --output .ci-office-notices
      - name: Stage matching Office resources inside the Windows installer
        shell: pwsh
        run: |
          ./scripts/stage_word_native.ps1 -Package apps/desktop/src-tauri/resources/office -AddIn apps/word-native-cpp/out/WorkProofWord.dll -PowerPointAddIn apps/word-native-cpp/out-powerpoint/WorkProofPowerPoint.dll -AddInX86 apps/word-native-cpp/out-x86/WorkProofWord.dll -PowerPointAddInX86 apps/word-native-cpp/out-powerpoint-x86/WorkProofPowerPoint.dll -Engine target/release/workproof-engine.exe -Docs docs -Notices .ci-office-notices
      - run: npm run build -w @workproof/desktop
      - name: Install the actual NSIS bundle and verify embedded Office setup files
        shell: pwsh
        run: |
          $installer=Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $destination=Join-Path $env:RUNNER_TEMP ('workproof-nsis-'+[guid]::NewGuid().ToString('N'))
          $process=Start-Process -FilePath $installer.FullName -ArgumentList @('/S',('/D='+$destination)) -WindowStyle Hidden -PassThru
          if(-not $process.WaitForExit(120000)){throw 'NSIS acceptance exceeded two minutes'}
          if($process.ExitCode -ne 0){throw 'NSIS installation failed'}
          # Tauri patches the reserved bundle-type marker in the NSIS payload.
          # Every other executable byte must match the exact-source build.
          python -c "import pathlib,sys; a=pathlib.Path('target/release/workproof-desktop.exe').read_bytes(); b=pathlib.Path(sys.argv[1]).read_bytes(); marker=b'__TAURI_BUNDLE_TYPE_VAR_UNK'; assert a==b or (a.count(marker)==1 and a.replace(marker,b'__TAURI_BUNDLE_TYPE_VAR_NSS')==b), 'Installed desktop executable differs from its build'; print('PASS installed desktop executable byte equivalence, allowing only Tauri NSIS marker')" (Join-Path $destination 'workproof-desktop.exe')
          if($LASTEXITCODE -ne 0){throw 'Installed executable verification failed'}
          $payload=Join-Path $destination 'office'
          $source='apps/desktop/src-tauri/resources/office'
          foreach($file in (Get-ChildItem -LiteralPath $source -Recurse -File -Force)){
            $relative=$file.FullName.Substring((Resolve-Path $source).Path.Length+1)
            $installed=Join-Path $payload $relative
            if(-not(Test-Path -LiteralPath $installed -PathType Leaf) -or (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash){throw ('Installed Office resource mismatch: '+$relative)}
          }
          foreach($entry in @('desktop-office-setup.ps1','WorkProofWord.dll','WorkProofWord.x86.dll','WorkProofPowerPoint.dll','WorkProofPowerPoint.x86.dll','workproof-engine.exe','BUILD-INFO.json')){
            if(-not(Test-Path -LiteralPath (Join-Path $payload $entry) -PathType Leaf)){throw ('Installed setup entry missing: '+$entry)}
          }
          Write-Output 'PASS actual NSIS installation and all embedded Office resource hashes; no Office registration or real host launch performed'
      - name: Desktop image report compatibility and process limits
        run: cargo test --release --locked -p workproof-desktop c2pa::tests
      - name: Native saved-file recording lifecycle
        run: cargo test --release --locked -p workproof-desktop saved_recording::tests
      - name: Encrypted report file and checksum transaction
        run: cargo test --release --locked -p workproof-desktop report_download::tests
      - name: Embedded verifier navigation and command isolation
        run: cargo test --release --locked -p workproof-desktop embedded_tests
      - name: Start real tray binary
        run: python scripts/test_tray.py target/release/workproof-desktop.exe
      - name: Real Windows internal titlebar and tray close behavior
        shell: pwsh
        run: ./scripts/test_desktop_window_controls.ps1 -Executable target/release/workproof-desktop.exe
      - name: Preserve native window diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-window-diagnostics
          path: test-results/native-window/
          if-no-files-found: ignore
      - name: Measure idle resources and durable ingestion
        shell: pwsh
        run: ./scripts/measure_windows.ps1 -Executable target/release/workproof-desktop.exe
      - name: Generate fixture and verify Windows collector
        run: |
          cargo run -p workproof-protocol --example generate_fixture -- apps/verifier/public/demo
          python scripts/test_engine.py target/release/workproof-engine.exe
      - name: Windows selective proof interoperability
        run: node scripts/test_disclosure.cjs target/release/workproof-engine.exe
      - name: Windows certificate-only inspection
        run: node scripts/test_certificate_inspection.cjs target/release/workproof-engine.exe target/release/workproof-inspector.exe
      - name: Windows native Photoshop grant isolation
        run: |
          cargo build --locked -p workproof-engine --example native_adapter_harness
          node scripts/test_photoshop_engine.cjs target/debug/examples/native_adapter_harness.exe target/release/workproof-engine.exe
      - name: Attest the Windows installer build
        if: ${{ github.repository == 'W-Boat/WorkProof' && github.event_name != 'pull_request' }}
        id: installer-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release/bundle/nsis/*-setup.exe
      - name: Verify installer provenance, changed bytes and wrong source rejection
        if: ${{ steps.installer-attestation.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ATTESTATION_BUNDLE: ${{ steps.installer-attestation.outputs.bundle-path }}
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          $installers=@(Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter '*-setup.exe')
          if($installers.Count -ne 1){throw 'Expected exactly one installer'}
          $bundle='target/release/bundle/nsis/BUILD-PROVENANCE.sigstore.json'
          Copy-Item -LiteralPath $env:BUILD_ATTESTATION_BUNDLE -Destination $bundle
          $policy=@('--bundle',$bundle,'--repo',$env:GITHUB_REPOSITORY,'--signer-workflow',"$env:GITHUB_REPOSITORY/.github/workflows/verify.yml",'--source-ref',$env:GITHUB_REF,'--deny-self-hosted-runners')
          $verified=& gh attestation verify $installers[0].FullName @policy --source-digest $env:GITHUB_SHA --format json
          if($LASTEXITCODE -ne 0){throw 'Installer provenance did not verify'}
          $verified | Set-Content -Encoding utf8 target/release/bundle/nsis/BUILD-PROVENANCE.verification.json
          & gh attestation verify $installers[0].FullName @policy --source-digest ('0'*40) 2>$null
          if($LASTEXITCODE -eq 0){throw 'Wrong source commit was accepted'}
          $changed=Join-Path $env:RUNNER_TEMP 'workproof-provenance-changed.exe'
          Copy-Item -LiteralPath $installers[0].FullName -Destination $changed
          $stream=[IO.File]::OpenWrite($changed)
          try {$stream.Seek(0,[IO.SeekOrigin]::End) | Out-Null; $stream.WriteByte(1)} finally {$stream.Dispose()}
          & gh attestation verify $changed @policy --source-digest $env:GITHUB_SHA 2>$null
          if($LASTEXITCODE -eq 0){throw 'Changed installer was accepted'}
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: workproof-windows-x64
          path: |
            test-desktop-window-controls.json
            target/release/workproof-desktop.exe
            target/release/workproof-engine.exe
            target/release/workproof-inspector.exe
            target/release/workproof-timestamp.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/BUILD-PROVENANCE*.json
            test-tray-results.json
            performance-windows.json
            test-engine-results.json
            README.md
            docs/

  unix-desktop:
    if: ${{ inputs.web_only != true }}
    needs: protocol-and-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            name: linux-x64
            build: build:linux
          - runner: macos-15
            name: macos-arm64
            build: build:macos
          - runner: macos-15-intel
            name: macos-x64
            build: build:macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Linux native dependencies and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-x11 zenity
      - run: npm ci
      - uses: ./.github/actions/c2pa-resource
      - uses: actions/download-artifact@v4
        with:
          name: workproof-web-and-extension
          path: .ci-artifacts
      - name: Prepare the same offline resources and brand icons
        run: |
          python3 - <<'PY'
          import pathlib,shutil
          base=pathlib.Path('apps/desktop/src-tauri/resources');base.mkdir(parents=True,exist_ok=True)
          shutil.copytree('.ci-artifacts/apps/verifier/out',base/'verifier',dirs_exist_ok=True)
          packages=list(pathlib.Path('.ci-artifacts/apps/extension').glob('*.vsix'));assert len(packages)==1
          shutil.copy2(packages[0],base/'workproof.vsix')
          PY
          npm run icons -w @workproof/desktop
      - name: Native protocol, state discovery and desktop integration
        run: |
          cargo test --locked -p workproof-protocol -p workproof-engine
          cargo build --locked -p workproof-engine --example data_location
          node scripts/test_locations.cjs target/debug/examples/data_location
          rustc --test apps/desktop/src-tauri/src/platform.rs -o "$RUNNER_TEMP/workproof-platform-tests"
          "$RUNNER_TEMP/workproof-platform-tests"
      - run: cargo build --locked -p workproof-engine --release
      - name: Generate native inspection fixture
        run: cargo run --locked -p workproof-protocol --example generate_fixture -- apps/verifier/public/demo
      - name: Native certificate-only inspection
        run: node scripts/test_certificate_inspection.cjs target/release/workproof-engine target/release/workproof-inspector
      - run: npm run ${{ matrix.build }} -w @workproof/desktop
      - name: Desktop image report compatibility and process limits
        run: cargo test --release --locked -p workproof-desktop c2pa::tests
      - name: Native saved-file recording lifecycle
        run: cargo test --release --locked -p workproof-desktop saved_recording::tests
      - name: Encrypted report file and checksum transaction
        run: cargo test --release --locked -p workproof-desktop report_download::tests
      - name: Embedded verifier navigation and command isolation
        run: cargo test --release --locked -p workproof-desktop embedded_tests
      - name: Install and start the real Linux package under a virtual display
        if: runner.os == 'Linux'
        run: |
          dpkg-deb -f target/release/bundle/deb/*.deb Depends | grep -F fonts-noto-cjk
          sudo apt-get install -y "$PWD"/target/release/bundle/deb/*.deb
          fc-match -f '%{family}\n' 'Noto Sans CJK SC' | grep -F 'Noto Sans CJK SC'
          xvfb-run -a dbus-run-session -- python3 scripts/test_tray.py /usr/bin/workproof-desktop
      - name: Verify the installed Linux native WebView and local Wasm flow
        if: runner.os == 'Linux'
        env:
          WORKPROOF_EXPECT_RESULT_FLOW: '1'
          WORKPROOF_EXPECT_BUILD_METADATA: '1'
        run: |
          sudo apt-get install -y webkit2gtk-driver
          cargo install tauri-driver --version 2.1.0 --locked --root "$RUNNER_TEMP/workproof-webdriver"
          xvfb-run -a dbus-run-session -- python3 scripts/test_embedded_webview.py "$RUNNER_TEMP/workproof-webdriver/bin/tauri-driver"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && runner.os == 'Linux' }}
        with:
          name: native-embedded-verifier-ui
          path: test-results/embedded-webview/
          if-no-files-found: warn
      - name: Start the real macOS app bundle and preserve its executable permissions
        if: runner.os == 'macOS'
        run: |
          python3 scripts/test_tray.py target/release/bundle/macos/WorkProof.app/Contents/MacOS/workproof-desktop
          tar -czf WorkProof-${{ matrix.name }}.app.tar.gz -C target/release/bundle/macos WorkProof.app
      - uses: actions/upload-artifact@v4
        with:
          name: workproof-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            WorkProof-*.app.tar.gz
            target/release/workproof-engine
            target/release/workproof-inspector
            target/release/workproof-timestamp
            test-tray-results.json
            docs/DESKTOP-PLATFORMS.md
