name: DetectorScope pinned source and model preflight
on:
  workflow_dispatch:
  push:
    paths:
      - tools/ai-assessment/detectorscope_preflight.py
      - tools/ai-assessment/calibration_data.py
      - tools/ai-assessment/test_calibration_data.py
      - docs/research/detectorscope-model-inventory-20261110.json
      - .github/workflows/detectorscope-preflight.yml
permissions:
  contents: read
jobs:
  metadata-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned source contract and small model files without weights
        run: python tools/ai-assessment/detectorscope_preflight.py
      - name: Verify independent selection namespaces without models or datasets
        run: python tools/ai-assessment/test_calibration_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: detectorscope-metadata-preflight
          path: detectorscope-preflight.json
          if-no-files-found: error
