name: AI evaluation contract and metrics
on:
  push:
    paths: ['tools/ai-assessment/evaluate.py', 'tools/ai-assessment/test_evaluate.py', 'tools/ai-assessment/benchmark_data.py', 'tools/ai-assessment/test_benchmark_data.py', 'tools/ai-assessment/calibrate.py', 'tools/ai-assessment/test_calibrate.py', '.github/workflows/ai-evaluation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check metric and provenance fixtures (not detector accuracy)
        run: |
          python tools/ai-assessment/test_evaluate.py
          python tools/ai-assessment/test_benchmark_data.py
          python tools/ai-assessment/test_calibrate.py
