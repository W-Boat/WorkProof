name: Desktop workbench UI
on:
  workflow_dispatch:
  push:
    paths: ['apps/desktop/ui/**', 'apps/desktop/frontend/**', 'apps/desktop/package.json', 'apps/desktop/src-tauri/tauri.conf.json', 'crates/engine/src/editor.rs', 'crates/engine/src/catalog.rs', 'crates/engine/src/lib.rs', 'crates/engine/src/pairing.rs', 'package-lock.json', 'scripts/stage_desktop_ui.cjs', 'scripts/test_editor_flows.cjs', 'tests/desktop-*.spec.ts', 'tests/desktop-select.ts', 'playwright.desktop.config.ts', '.github/workflows/desktop-ui.yml']
permissions:
  contents: read
jobs:
  windows-edge:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/protocol-browser-resource
      - run: node scripts/stage_desktop_ui.cjs
      - name: Real bundled editor and verifier in the Windows system browser
        env:
          WORKPROOF_BROWSER_CHANNEL: msedge
        run: npx playwright test --config playwright.desktop.config.ts --project chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-workbench-windows-edge
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
  desktop-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Real editor persistence, external catalog and signed export boundaries
        run: cargo test --locked -p workproof-engine
      - uses: ./.github/actions/protocol-browser-resource
      - name: Stage the canonical design system and brand
        run: node scripts/stage_desktop_ui.cjs
      - name: Group raw editor actions without changing evidence
        run: node --test scripts/test_editor_flows.cjs
      - name: Chinese system font for screenshot review
        timeout-minutes: 3
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y fonts-noto-cjk
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --config playwright.desktop.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-workbench-ui
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
