name: Verifier runtime license notices
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verifier-licenses.yml'
      - 'scripts/verifier_graph_notices.py'
      - 'scripts/word_package_notices.py'
      - 'docs/licenses/office-npm-supplemental/**'
      - 'apps/verifier/package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  notices:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Stage exact dependency licenses and verify supplemental source hashes
        run: python3 scripts/verifier_graph_notices.py
      - uses: actions/upload-artifact@v4
        with:
          name: verifier-runtime-license-evidence
          path: apps/verifier/public/notices/graph/
          if-no-files-found: error
