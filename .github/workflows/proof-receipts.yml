name: Proof receipt trust boundaries
on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/proof/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/proof-receipts.yml'
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Receipt explicit trust, exact binding, time policy and existing protocol regressions
        run: cargo test --locked -p workproof-protocol
