name: Proof receipt trust boundaries
on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/proof/**'
      - 'crates/engine/src/bin/workproof-receipt.rs'
      - 'scripts/test_receipt_cli.cjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/proof-receipts.yml'
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Receipt explicit trust, exact binding, time policy and existing protocol regressions
        run: cargo test --locked -p workproof-protocol
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the actual one-shot issuer utility
        run: cargo build --locked -p workproof-engine --bin workproof-receipt
      - name: Generate the signed public fixture using the real protocol implementation
        run: cargo run --locked -p workproof-protocol --example generate_fixture -- apps/verifier/public/demo
      - name: Exercise receipt issuance and independent verification with synthetic keys
        run: node scripts/test_receipt_cli.cjs target/debug/workproof-receipt
