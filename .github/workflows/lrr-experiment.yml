name: Experimental modern causal LRR
on:
  workflow_dispatch:
  push:
    paths: ['tools/ai-assessment/lrr_*.py', 'tools/ai-assessment/test_lrr*.py', 'tools/ai-assessment/lrr-model.json', '.github/workflows/lrr-experiment.yml']
permissions:
  contents: read
jobs:
  fixed-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare separate CPU reference runtime
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/ai-assessment/requirements.txt
          python -m pip check
      - name: Independently implemented formula and refusal boundaries
        run: python tools/ai-assessment/test_lrr_math.py
      - name: Fixed model bilingual inference and measured resource budgets
        run: python tools/ai-assessment/test_lrr_real.py
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-lrr-synthetic-validation
          path: lrr-synthetic-results.json
          if-no-files-found: error
