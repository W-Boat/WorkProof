name: Independent bilingual LRR calibration and heldout
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        language: [en, zh]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze source-group partitions before any inference
        run: |
          python tools/ai-assessment/test_calibration_data.py
          python tools/ai-assessment/calibration_data.py --output "$RUNNER_TEMP/lrr-inputs" --per-cell 8
      - name: Prepare isolated CPU runtime
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/ai-assessment/requirements.txt
          python -m pip check
          python tools/ai-assessment/test_lrr_math.py
          python tools/ai-assessment/test_lrr_model.py
          python tools/ai-assessment/test_evaluate_lrr.py
      - name: Calibration then frozen-policy untouched evaluation
        env:
          LANGUAGE: ${{ matrix.language }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python tools/ai-assessment/evaluate_lrr.py --inputs "$RUNNER_TEMP/lrr-inputs" --model-dir "$RUNNER_TEMP/lrr-model" --output lrr-evaluation --language "$LANGUAGE"
      - name: Preserve non-text source selection evidence
        if: always()
        run: |
          mkdir -p lrr-evaluation
          cp "$RUNNER_TEMP/lrr-inputs/selection-receipt.json" lrr-evaluation/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-lrr-${{ matrix.language }}
          path: lrr-evaluation/*.json
          if-no-files-found: warn
