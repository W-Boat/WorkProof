name: Pinned bilingual detector benchmark
on:
  push:
    paths: ['.github/workflows/ai-benchmark.yml']
  workflow_dispatch:
    inputs:
      per_cell:
        description: 'Pairs per language/generator/domain cell; 4 gives 96 human and 96 generated samples per language'
        type: choice
        options: ['4','1','2']
        default: '4'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mpu-en-v3
            language: en
          - engine: mpu-zh-v3
            language: zh
          - engine: desklib-en-v1.01
            language: en
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      WORKPROOF_BENCHMARK_ENGINE: ${{ matrix.engine }}
      WORKPROOF_BENCHMARK_LANGUAGE: ${{ matrix.language }}
      WORKPROOF_BENCHMARK_QUOTA: ${{ inputs.per_cell || '4' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify metric and selection fixtures before real downloads
        run: |
          python tools/ai-assessment/test_evaluate.py
          python tools/ai-assessment/test_benchmark_data.py
      - name: Explicitly download pinned public benchmark and select test inputs
        run: python tools/ai-assessment/benchmark_data.py --output "$RUNNER_TEMP/workproof-benchmark" --per-cell "$WORKPROOF_BENCHMARK_QUOTA"
      - name: Preserve non-text provenance before inference
        run: |
          mkdir -m 700 benchmark-results
          cp "$RUNNER_TEMP/workproof-benchmark/selection-receipt.json" benchmark-results/
          cp "$RUNNER_TEMP/workproof-benchmark/$WORKPROOF_BENCHMARK_ENGINE-policy.json" benchmark-results/
      - name: Install isolated CPU runtime and explicitly prepare fixed weights
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r tools/ai-assessment/requirements.txt
          pip check
          python tools/ai-assessment/detector.py prepare --engine "$WORKPROOF_BENCHMARK_ENGINE" --model-dir "$RUNNER_TEMP/workproof-benchmark-model"
      - name: Evaluate actual offline inference using the frozen upstream rule
        run: |
          python tools/ai-assessment/evaluate.py --dataset "$RUNNER_TEMP/workproof-benchmark/$WORKPROOF_BENCHMARK_LANGUAGE.jsonl" --policy "$RUNNER_TEMP/workproof-benchmark/$WORKPROOF_BENCHMARK_ENGINE-policy.json" --model-dir "$RUNNER_TEMP/workproof-benchmark-model" --output "benchmark-results/$WORKPROOF_BENCHMARK_ENGINE-report.json"
          cp "$RUNNER_TEMP/workproof-benchmark-model/workproof-model.json" benchmark-results/model-receipt.json
      - name: Show measured coverage and require applicable samples without setting an accuracy pass mark
        run: |
          python - <<'PY'
          import json,os,pathlib
          engine=os.environ['WORKPROOF_BENCHMARK_ENGINE']
          report=json.loads(pathlib.Path('benchmark-results',engine+'-report.json').read_text())
          overall=report['overall']
          print(json.dumps({'engine':engine,'policy_mode':report['policy_mode'],'overall':overall},indent=2))
          assert report['policy_mode']=='published_fixed' and report['declared_calibration_samples']==0
          assert overall['samples']==48*int(os.environ['WORKPROOF_BENCHMARK_QUOTA'])
          assert overall['false_positive']['count']>0 and overall['false_negative']['count']>0, 'No applicable scored human or generated samples; no usable false-positive result'
          assert not any(overall['statuses'].get(status,0) for status in ('error','timeout','not_configured')), 'Inference failures remain; inspect coverage and retained report'
          print('Measurements produced; no accuracy acceptance, independent calibration or commercial clearance is implied.')
          PY
      - name: Preserve runtime inventory without document text
        if: always()
        run: pip inspect > benchmark-runtime-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bilingual-benchmark-${{ matrix.engine }}
          path: |
            benchmark-results/*.json
            benchmark-runtime-inventory.json
          if-no-files-found: warn
          # Raw datasets, selected JSONL and weights deliberately remain ephemeral.
