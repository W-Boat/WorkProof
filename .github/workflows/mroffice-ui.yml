name: MR Office desktop integration
on:
  push:
    paths:
      - 'apps/desktop/frontend/editor.js'
      - 'apps/desktop/frontend/mroffice/**'
      - 'apps/desktop/ui/mroffice*'
      - 'apps/desktop/package.json'
      - 'package-lock.json'
      - 'scripts/stage_mroffice.cjs'
      - 'tests/desktop-mroffice.spec.ts'
      - 'tests/desktop-editor.spec.ts'
      - '.github/workflows/mroffice-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node scripts/stage_desktop_ui.cjs
      - name: Offline authoring and linked Word round trip
        env:
          WORKPROOF_BROWSER_CHANNEL: msedge
        run: npx playwright test --config playwright.desktop.config.ts --project chromium --grep "MR Office" --reporter=list,github
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mroffice-browser-diagnostics
          path: |
            test-results/
            playwright-report/
