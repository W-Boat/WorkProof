name: Institution backend baseline
on:
  push:
    paths: ['deploy/institution/**', 'services/institution/**', 'apps/office/**', 'crates/proof/**', 'crates/engine/**', 'scripts/local/**', 'scripts/test_institution*.py', 'scripts/test_backup_crypto.py', 'scripts/test_snapshot_archive.py', 'scripts/test_restore_snapshot.py', 'scripts/test_restore_new.py', 'scripts/test_catalog_server.py', 'scripts/test_catalog_receipt.py', 'scripts/test_backup_coordinator.py', 'scripts/test_backup_failures.py', 'scripts/test_institution*.cjs', 'scripts/test_local_runtime.ps1', 'scripts/test_catalog_preparation.ps1', '.github/workflows/institution.yml', '!services/institution/*.md', '!services/institution/**/*.md']
  workflow_dispatch:
    inputs:
      ai_models:
        description: 'Prepare real public models for authenticated AI workbench acceptance'
        type: boolean
        default: false
      windows_only:
        description: 'Only validate/package Windows controls; use when JAR source is unchanged'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  backup-control-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Coordinator identity and cancellation guards without Docker mutations
        run: |
          python3 scripts/test_backup_coordinator.py
          sudo python3 scripts/test_backup_failures.py
  scaffold:
    if: ${{ inputs.windows_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_DATABASE: workproof_ci
          MYSQL_USER: workproof_ci
          MYSQL_PASSWORD: fixture-only-ci-password
          MYSQL_ROOT_PASSWORD: fixture-only-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=20
      cache:
        image: valkey/valkey:8.0
        ports: ['6379:6379']
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/institution/scaffold-vue/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build shared native certificate verifier and signed fixture
        run: |
          cargo build --locked -p workproof-engine --release
          cargo run --locked -p workproof-protocol --example generate_fixture -- apps/verifier/public/demo
      - name: Shared backend tests
        working-directory: services/institution/scaffold-system
        run: mvn -B -pl scaffold-system -am test
      - name: Embed Word and WPS add-in resources
        run: |
          npm ci
          node apps/office/build.mjs
          mkdir -p services/institution/scaffold-system/scaffold-admin/src/main/resources/static/office
          cp -r apps/office/dist/* services/institution/scaffold-system/scaffold-admin/src/main/resources/static/office/
      - name: Vue component tests and production build
        working-directory: services/institution/scaffold-vue
        run: |
          npm ci
          npm run test:unit
          npm run build
      - name: Embed production Vue UI in the service
        run: cp -r services/institution/scaffold-vue/dist/. services/institution/scaffold-system/scaffold-admin/src/main/resources/static/
      - name: Package institution service
        working-directory: services/institution/scaffold-system
        run: mvn -B -pl scaffold-admin -am package -DskipTests
      - name: Install browser for the real institution certificate workflow
        run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        if: ${{ inputs.ai_models }}
        with:
          python-version: '3.12'
      - name: Explicit real AI model preparation
        if: ${{ inputs.ai_models }}
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r tools/ai-assessment/requirements.txt
          python tools/ai-assessment/detector.py prepare --engine mpu-zh-v3 --model-dir .ci-institution-ai/mpu-zh-v3
          python tools/ai-assessment/detector.py prepare --engine mpu-en-v3 --model-dir .ci-institution-ai/mpu-en-v3
          python tools/ai-assessment/detector.py prepare --engine desklib-en-v1.01 --model-dir .ci-institution-ai/desklib-en-v1.01
      - name: Test the real bundled application, generated password and API boundaries
        # Model preparation is opt-in and never part of the recorder runtime.
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: workproof_ci
          DB_USERNAME: workproof_ci
          DB_PASSWORD: fixture-only-ci-password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          WORKPROOF_TEST_REAL_AI: ${{ inputs.ai_models && '1' || '0' }}
        run: |
          python scripts/test_institution_runtime.py
          python scripts/test_institution_jobs.py
      - name: Assemble the same-revision server image context
        shell: python
        run: |
          import pathlib,shutil
          root=pathlib.Path('.')
          context=root/'.ci-institution-server'
          shutil.copytree(root/'deploy/institution',context)
          jars=list((root/'services/institution/scaffold-system/scaffold-admin/target').glob('scaffold-admin-*.jar'))
          assert len(jars)==1,'Expected exactly one bootable JAR'
          shutil.copy2(jars[0],context/'app.jar')
          shutil.copy2(root/'target/release/workproof-inspector',context/'workproof-inspector')
          (context/'sql').mkdir()
          for name in ['V1__init_schema.sql','V2__seed_data.sql','V3__workproof_certificate_catalog.sql','V4__workproof_certificate_jobs.sql']:
              shutil.copy2(root/'services/institution/scaffold-system/sql'/name,context/'sql'/name)
      - name: Build the precompiled Linux amd64 server image
        run: docker build --platform linux/amd64 --build-arg SOURCE_COMMIT=${{ github.sha }} --label org.opencontainers.image.revision=${{ github.sha }} -t workproof-institution:local .ci-institution-server
      - name: Exercise the real server image and isolated new database
        run: python scripts/test_institution_server.py
      - name: Check coordinator container and volume identity guards
        run: python scripts/test_backup_coordinator.py
      - name: Verify authenticated byte encryption in the actual server image
        run: docker run --rm --network none -v "$PWD/scripts/test_backup_crypto.py:/test_backup_crypto.py:ro" --entrypoint python3 workproof-institution:local /test_backup_crypto.py
      - name: Verify restricted encrypted snapshots without restoring data
        run: docker run --rm --user 0 --network none -v "$PWD/scripts/test_snapshot_archive.py:/test_snapshot_archive.py:ro" --entrypoint python3 workproof-institution:local /test_snapshot_archive.py
      - name: Authenticate and extract only to new private staging directories
        run: docker run --rm --user 0 --network none -v "$PWD/scripts/test_restore_snapshot.py:/test_restore_snapshot.py:ro" --entrypoint python3 workproof-institution:local /test_restore_snapshot.py
      - name: Check catalog preparation records and encrypted archive boundary
        run: docker run --rm --user 0 --network none -v "$PWD/scripts/test_catalog_receipt.py:/test_catalog_receipt.py:ro" --entrypoint python3 workproof-institution:local /test_catalog_receipt.py
      - name: Archive the verified image without any deployment secrets
        shell: python
        run: |
          import gzip,hashlib,json,os,pathlib,shutil,subprocess
          output=pathlib.Path('dist/institution-server-linux-amd64');output.mkdir(parents=True)
          for source in pathlib.Path('deploy/institution').iterdir():
              if source.is_file():shutil.copy2(source,output/source.name)
          required_tools=['compose.yaml','backup_coordinator.py','backup_collect.py','backup_crypto.py',
                          'snapshot_archive.py','restore_snapshot.py','restore_new.py','catalog_receipt.py','catalog_prepare.py','entrypoint.py','manage.py']
          assert all((output/name).is_file() for name in required_tools),'Incomplete server control package'
          shutil.copy2('docs/INSTITUTION-SERVER.md',output/'README.md')
          shutil.copy2('LICENSE',output/'WORKPROOF-LICENSE.txt')
          shutil.copy2('services/institution/LICENSE',output/'SCAFFOLD-LICENSE.txt')
          shutil.copy2('docs/COMMERCIAL-LICENSE-AUDIT.md',output/'COMMERCIAL-LICENSE-AUDIT.md')
          with gzip.open(output/'workproof-institution-image.tar.gz','wb',compresslevel=1) as stream:
              process=subprocess.Popen(['docker','save','workproof-institution:local'],stdout=subprocess.PIPE)
              with process.stdout as source:shutil.copyfileobj(source,stream)
              assert process.wait()==0,'Image export failed'
          image=json.loads(subprocess.check_output(['docker','image','inspect','workproof-institution:local']))[0]
          compose=json.loads(subprocess.check_output(['docker','compose','--file','deploy/institution/compose.yaml','config','--format','json']))
          dependencies={}
          for name in ('database','cache'):
              reference=compose['services'][name]['image']
              installed=json.loads(subprocess.check_output(['docker','image','inspect',reference]))[0]
              dependencies[name]={'reference':reference,'image_id':installed['Id'],'repository_digests':installed.get('RepoDigests') or [],'bundled':False}
          (output/'BUILD-INFO.json').write_text(json.dumps({'schema':'workproof.server-package.v1','source_commit':os.environ['GITHUB_SHA'],'build_run':os.environ['GITHUB_RUN_ID'],'image_id':image['Id'],'platform':'linux/amd64','control_tools':required_tools,'runtime_dependencies':dependencies,'scope':'V1/V2 new deployment; explicit V3 catalog preparation and restore supported; catalog disabled until prepared; jobs/AI disabled; no deployment secrets included; database/cache images must be prepared separately'},indent=2)+'\n',encoding='utf-8')
          lines=[]
          for file in sorted(output.iterdir()):
              if file.is_file():
                  with file.open('rb') as stream:digest=hashlib.file_digest(stream,'sha256').hexdigest()
                  lines.append(digest+'  '+file.name+'\n')
          (output/'SHA256SUMS.txt').write_text(''.join(lines),encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: institution-server-linux-amd64
          path: |
            dist/institution-server-linux-amd64/
            test-institution-server-results.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: institution-baseline
          path: |
            services/institution/scaffold-system/scaffold-admin/target/*.jar
            services/institution/scaffold-vue/dist/
            target/release/workproof-engine
            target/release/workproof-inspector
            test-results/institution-certificate-inspection-*.png
            test-results/institution-certificate-catalog.png
            test-results/institution-certificate-batch-mobile.png
            test-results/institution-ai-*.png
            test-results/institution-jobs-*.png
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: institution-runtime-diagnostics
          path: |
            institution-runtime.log
            test-results/institution-jobs-*.png
            test-results/institution-ai-*.png
            institution-https.log
            test-results/institution-certificate-batch-mobile.png
            test-results/institution-certificate-catalog.png
            test-results/institution-certificate-inspection-*.png
  windows-launchers:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test process ownership and local launch scripts
        shell: pwsh
        run: ./scripts/test_local_runtime.ps1
      - name: Test catalog preparation control flow
        shell: pwsh
        run: ./scripts/test_catalog_preparation.ps1
      - name: Package local controls and initialization SQL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local-launchers/scripts/local,.local-launchers/sql | Out-Null
          Copy-Item scripts/local/* .local-launchers/scripts/local/
          Copy-Item services/institution/scaffold-system/sql/V[1234]*.sql .local-launchers/sql/
          Copy-Item docs/LOCAL-RUNTIME.md .local-launchers/README.md
          Copy-Item docs/LOCAL-RUNTIME.md,docs/INSTITUTION-JOBS.md,docs/ALL-STAGES.md,docs/OFFICE-SERVER.md,docs/COMMERCIAL-LICENSE-AUDIT.md .local-launchers/
          Copy-Item docs/licenses .local-launchers/licenses -Recurse
          Copy-Item LICENSE .local-launchers/WORKPROOF-LICENSE.txt
          Copy-Item services/institution/LICENSE .local-launchers/SCAFFOLD-LICENSE.txt
          foreach ($entry in @{Start='start';Stop='stop';Status='status';'Show account'='account';'Trust localhost'='trust';'Remove localhost trust'='untrust';'Install Word add-in'='word';'Remove Word add-in'='remove-word';'Certificate catalog plan'='catalog-plan';'Prepare certificate catalog'='catalog-prepare'}.GetEnumerator()) {
            ('@echo off' + "`r`n" + 'call "%~dp0scripts\local\run.cmd" ' + $entry.Value + ' "%~dp0."' + "`r`n") | Set-Content -LiteralPath ('.local-launchers/' + $entry.Key + '.cmd') -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: workproof-local-launchers
          path: .local-launchers/
          include-hidden-files: true
          if-no-files-found: error
