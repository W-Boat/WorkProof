name: Native Word add-in and matching Windows collector
on:
  push:
    paths:
      - 'apps/word-native-cpp/**'
      - 'apps/word-native/**'
      - 'apps/desktop/**'
      - 'apps/verifier/**'
      - 'apps/extension/**'
      - 'crates/engine/**'
      - 'crates/proof/**'
      - 'scripts/local/install-native-word.ps1'
      - 'scripts/local/open-native-word.ps1'
      - 'scripts/local/open-native-powerpoint.ps1'
      - 'scripts/local/install-native-powerpoint.ps1'
      - 'scripts/local/native-office-platform.ps1'
      - 'scripts/local/*.cmd'
      - 'scripts/stage_word_native.ps1'
      - 'scripts/verify_package_zip.py'
      - 'scripts/test_package_zip.py'
      - 'scripts/word_package_notices.py'
      - 'scripts/verifier_graph_notices.py'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'package-lock.json'
      - 'package.json'
      - '.gitattributes'
      - 'docs/licenses/office-supplemental/**'
      - 'docs/licenses/office-npm-supplemental/**'
      - 'scripts/test_native_fingerprint.py'
      - 'scripts/test_word_native.cjs'
      - 'scripts/test_word_native_dll.ps1'
      - 'scripts/test_office_bitness.ps1'
      - 'docs/WORD-NATIVE.md'
      - '.github/workflows/word-native.yml'
      - '.github/actions/c2pa-resource/**'
      - '.github/actions/c2pa-browser-resource/**'
      - '.github/actions/protocol-browser-resource/**'
      - '.github/actions/wasm-bindgen-cli/**'
      - 'tools/c2pa-wasm/**'
      - 'tools/c2pa/**'
      - 'scripts/c2pa_notices.py'
      - 'docs/licenses/c2pa-*/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-x86-adapters:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build and probe the real 32-bit Word add-in
        shell: pwsh
        run: ./apps/word-native-cpp/build.ps1 -Architecture x86 -OutDir apps/word-native-cpp/out-x86
      - name: Build and probe the real 32-bit PowerPoint add-in
        shell: pwsh
        run: ./apps/word-native-cpp/build.ps1 -Architecture x86 -PowerPoint -OutDir apps/word-native-cpp/out-powerpoint-x86
      - uses: actions/upload-artifact@v4
        with:
          name: native-office-x86-adapters
          if-no-files-found: error
          path: |
            apps/word-native-cpp/out-x86/WorkProofWord.dll
            apps/word-native-cpp/out-x86/test_addin.exe
            apps/word-native-cpp/out-powerpoint-x86/WorkProofPowerPoint.dll
            apps/word-native-cpp/out-powerpoint-x86/test_addin.exe
  # Native in-proc COM add-in: no CLR, no Office.js sideload, no local HTTPS.
  native-addin:
    needs: native-x86-adapters
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-office-x86-adapters
          path: .ci-office-x86
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: npm ci
      - uses: ./.github/actions/c2pa-resource
      - uses: ./.github/actions/c2pa-browser-resource
      - uses: ./.github/actions/protocol-browser-resource
      - name: Build the offline verifier and the VS Code extension for the same desktop
        run: |
          npm run build:web
          npm run build:extension
          npm run package -w workproof-vscode
      - name: Prepare bundling resources and brand icons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/resources | Out-Null
          Copy-Item -Recurse apps/verifier/out apps/desktop/src-tauri/resources/verifier
          Copy-Item apps/extension/*.vsix apps/desktop/src-tauri/resources/workproof.vsix
          npm run icons -w @workproof/desktop
      - name: Protocol and collector tests
        run: cargo test --locked -p workproof-protocol -p workproof-engine
      - name: Build the collector that ships with the add-in
        run: cargo build --locked --release -p workproof-engine --bin workproof-engine
      - name: Native fingerprint matches the published BLAKE3 vector
        run: python scripts/test_native_fingerprint.py target/release/workproof-engine.exe
      - name: Build the native COM add-in and probe it without Word
        shell: pwsh
        run: ./apps/word-native-cpp/build.ps1 -Architecture x64 -OutDir apps/word-native-cpp/out
      - name: Build native PowerPoint adapter
        shell: pwsh
        run: ./apps/word-native-cpp/build.ps1 -Architecture x64 -PowerPoint -OutDir apps/word-native-cpp/out-powerpoint
      - name: Build the desktop that accepts the native word grant
        working-directory: apps/desktop
        run: npx tauri build --no-bundle
      - name: Desktop image report compatibility and process limits
        run: cargo test --release --locked -p workproof-desktop c2pa::tests
      - name: Embedded verifier navigation and command isolation
        run: cargo test --release --locked -p workproof-desktop embedded_tests
      - name: Native word grant, session, export and isolation against the real collector
        run: |
          cargo build --locked -p workproof-engine --example native_adapter_harness
          node scripts/test_word_native.cjs target/debug/examples/native_adapter_harness.exe target/release/workproof-engine.exe
      - name: Collect locked dependency notices for the delivered kit
        run: python scripts/word_package_notices.py --output .ci-word-notices
      - name: Stage the portable kit and hash every file
        shell: pwsh
        run: |
          $vsix = Get-ChildItem apps/extension/*.vsix | Select-Object -First 1
          ./scripts/stage_word_native.ps1 -Package "$env:RUNNER_TEMP/workproof-native-word" `
            -AddIn apps/word-native-cpp/out/WorkProofWord.dll `
            -PowerPointAddIn apps/word-native-cpp/out-powerpoint/WorkProofPowerPoint.dll `
            -AddInX86 .ci-office-x86/out-x86/WorkProofWord.dll `
            -PowerPointAddInX86 .ci-office-x86/out-powerpoint-x86/WorkProofPowerPoint.dll `
            -Engine target/release/workproof-engine.exe `
            -Desktop target/release/workproof-desktop.exe `
            -Verifier apps/verifier/out `
            -Vsix $vsix.FullName `
            -Docs docs `
            -Notices .ci-word-notices `
            -C2pa apps/desktop/src-tauri/resources/c2pa `
            -Zip dist/workproof-native-word-windows-dev.zip
      - name: Check both host architectures with actual PE files and isolated registration
        shell: pwsh
        run: |
          ./scripts/test_office_bitness.ps1 -Package "$env:RUNNER_TEMP/workproof-native-word" `
            -X86WordProbe .ci-office-x86/out-x86/test_addin.exe `
            -X64WordProbe apps/word-native-cpp/out/test_addin.exe `
            -X86PowerPointProbe .ci-office-x86/out-powerpoint-x86/test_addin.exe `
            -X64PowerPointProbe apps/word-native-cpp/out-powerpoint/test_addin.exe
      - name: Verify every actual ZIP member including hidden upstream notices
        run: |
          python scripts/test_package_zip.py
          python scripts/verify_package_zip.py dist/workproof-native-word-windows-dev.zip
          python -c "import pathlib; p=pathlib.Path('.ci-c2pa-public-fixtures'); expected={'full.png','selected.png','unsigned.png','synthetic-ca.pem','wrong-ca.pem','baseline.jpg','progressive.jpg','README.txt','VALIDATION.json','SHA256SUMS.txt'}; assert {f.name for f in p.iterdir()}==expected, 'Unexpected public fixture content; refuse publication'"
      - name: Install Chromium for the actual packaged verifier
        run: npx playwright install chromium
      - name: Verify ordinary proofs, structure edges and embedded images from the portable kit
        env:
          WORKPROOF_TEST_WEB_ENGINE: ${{ runner.temp }}/workproof-native-word/workproof-engine.exe
          WORKPROOF_TEST_WEB_ROOT: ${{ runner.temp }}/workproof-native-word/verifier
          WORKPROOF_TEST_EMBEDDED_FIXTURES: .ci-c2pa-public-fixtures
          WORKPROOF_TEST_EMBEDDED_ASSET: selected.png
        run: node tools/c2pa-wasm/test-ui.cjs
      - name: Register and unregister PowerPoint in isolated registry
        shell: pwsh
        run: |
          foreach ($entry in @('Install PowerPoint.cmd','Open PowerPoint WorkProof.cmd','Remove PowerPoint add-in.cmd','open-native-powerpoint.ps1')) {
            if (-not (Test-Path -LiteralPath (Join-Path "$env:RUNNER_TEMP/workproof-native-word" $entry) -PathType Leaf)) { throw "Missing PowerPoint entry: $entry" }
          }
          $fixture = 'Software\WorkProofNativePowerPointCI\' + [Guid]::NewGuid().ToString()
          try {
            & ./scripts/local/install-native-powerpoint.ps1 -RuntimeRoot "$env:RUNNER_TEMP/workproof-native-word" -RegistryFixture $fixture
            if ($LASTEXITCODE) { throw 'PowerPoint fixture install failed' }
            & ./scripts/local/install-native-powerpoint.ps1 -RuntimeRoot "$env:RUNNER_TEMP/workproof-native-word" -RegistryFixture $fixture -Remove
          } finally {
            $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::CurrentUser,[Microsoft.Win32.RegistryView]::Registry64)
            try { $base.DeleteSubKeyTree($fixture.Replace('/','\'),$false) } finally { $base.Dispose() }
          }
      - name: Register and unregister the staged kit in an isolated registry fixture
        shell: pwsh
        run: |
          $package = "$env:RUNNER_TEMP/workproof-native-word"
          foreach ($entry in @('Install Word.cmd','Open WorkProof.cmd','Remove Word add-in.cmd','open-native-word.ps1','BUILD-INFO.json','third-party-notices/inventory.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $package $entry) -PathType Leaf)) { throw "Missing click entry: $entry" }
          }
          $errors=$null;$tokens=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $package 'open-native-word.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw 'Desktop entry contains PowerShell syntax errors' }
          $fixture = 'Software\WorkProofNativeWordCI\' + [Guid]::NewGuid().ToString()
          $clsid = '{5F628C20-62BB-4DA6-94DF-36BD599A9301}'
          function OpenCurrentUser {
            [Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::CurrentUser, [Microsoft.Win32.RegistryView]::Registry64)
          }
          try {
            & ./scripts/local/install-native-word.ps1 -RuntimeRoot $package -RegistryFixture $fixture
            $registry = OpenCurrentUser
            try {
              $entry = $registry.OpenSubKey($fixture + '\Software\Microsoft\Office\Word\Addins\WorkProof.WordNative.Connect')
              if (-not $entry) { throw 'Word Addins registration is missing' }
              if ($entry.GetValue('LoadBehavior') -ne 3) { throw 'LoadBehavior is not 3' }
              if ([string]::IsNullOrWhiteSpace([string]$entry.GetValue('FriendlyName'))) { throw 'FriendlyName is missing' }
              $entry.Dispose()
              $inproc = $registry.OpenSubKey($fixture + '\Software\Classes\CLSID\' + $clsid + '\InprocServer32')
              if (-not $inproc) { throw 'InprocServer32 registration is missing' }
              $server = [string]$inproc.GetValue('')
              if (-not $server.EndsWith('WorkProofWord.dll')) { throw "InprocServer32 does not point at the native add-in: $server" }
              if ($inproc.GetValue('ThreadingModel') -ne 'Apartment') { throw 'ThreadingModel is not Apartment' }
              if ($null -ne $inproc.GetValue('Assembly')) { throw 'A native add-in must not register a managed Assembly value' }
              $inproc.Dispose()
            } finally { $registry.Dispose() }
            & ./scripts/local/install-native-word.ps1 -RuntimeRoot $package -RegistryFixture $fixture -Remove
            $registry = OpenCurrentUser
            try {
              if ($registry.OpenSubKey($fixture + '\Software\Microsoft\Office\Word\Addins\WorkProof.WordNative.Connect')) { throw 'Add-in registration survived removal' }
              if ($registry.OpenSubKey($fixture + '\Software\Classes\CLSID\' + $clsid)) { throw 'CLSID registration survived removal' }
              if ($registry.OpenSubKey($fixture + '\Software\Classes\WorkProof.WordNative.Connect')) { throw 'ProgId survived removal' }
            } finally { $registry.Dispose() }
            Write-Output 'PASS: isolated install, inspection and removal of the native add-in'
          } finally {
            Remove-Item -LiteralPath ('HKCU:\' + $fixture) -Recurse -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-image-ui-validation-only
          include-hidden-files: true
          path: .ci-c2pa-public-fixtures/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: workproof-native-word-windows-dev
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/workproof-native-word/
            dist/workproof-native-word-windows-dev.zip
            test-word-native-results.json
            test-office-bitness-results.json
          if-no-files-found: error

  # The earlier managed add-in stays in the repository and keeps its own probe, but it is not shipped.
  managed-addin:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build the Framework COM add-in without Office or NuGet
        run: msbuild apps/word-native/WorkProof.WordNative.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:RegisterForComInterop=false /verbosity:minimal
      - name: Inspect the real COM type, ribbon markup and embedded picture
        shell: pwsh
        run: ./scripts/test_word_native_dll.ps1 -Assembly apps/word-native/bin/Release/WorkProof.WordNative.dll
