name: Local metadata browser acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/metadata-browser.yml'
      - 'playwright.metadata.config.ts'
      - 'apps/verifier/components/MetadataPanel.tsx'
      - 'apps/verifier/public/*metadata*.js'
      - 'tests/metadata.spec.ts'
  pull_request:
    paths:
      - '.github/workflows/metadata-browser.yml'
      - 'playwright.metadata.config.ts'
      - 'apps/verifier/components/MetadataPanel.tsx'
      - 'apps/verifier/public/*metadata*.js'
      - 'tests/metadata.spec.ts'
permissions:
  contents: read
concurrency:
  group: metadata-browser-${{ github.ref }}
  cancel-in-progress: false
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck -w @workproof/verifier
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Real local metadata page in three browser engines
        run: npx playwright test --config playwright.metadata.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-browser-report
          path: |
            playwright-report/
            test-results/
          include-hidden-files: true
          if-no-files-found: warn
