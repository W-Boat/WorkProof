name: C2PA PNG JPEG and PDF interoperability
on:
  push:
    paths: ['tools/c2pa/**', 'crates/proof/**', 'scripts/test_c2pa.py', 'scripts/test_c2pa_pdf.py', 'scripts/c2pa_notices.py', 'docs/licenses/c2pa-*/**', '.gitattributes', '.github/workflows/c2pa.yml']
  pull_request:
    paths: ['tools/c2pa/**', 'crates/proof/**', 'scripts/test_c2pa.py', 'scripts/test_c2pa_pdf.py', 'scripts/c2pa_notices.py', 'docs/licenses/c2pa-*/**', '.gitattributes', '.github/workflows/c2pa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c2pa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  platform-tools:
    name: C2PA native verification (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x64
            host: x86_64-pc-windows-msvc
            suffix: .exe
          - runner: macos-15
            platform: macos-arm64
            host: aarch64-apple-darwin
            suffix: ''
          - runner: macos-15-intel
            platform: macos-x64
            host: x86_64-apple-darwin
            suffix: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tools/c2pa -> target'
          key: c2pa-${{ matrix.platform }}
          cache-on-failure: true
      - name: Verify native host architecture and fetch reviewed lockfile
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          rustc -vV
          python -c 'import os,subprocess; actual=subprocess.check_output(["rustc","-vV"],text=True); assert "host: "+os.environ["EXPECTED_HOST"] in actual, actual'
          cargo fetch --locked --manifest-path tools/c2pa/Cargo.toml
      - name: Build optional CLI without recorder dependency changes
        id: build
        run: cargo build --release --locked --manifest-path tools/c2pa/Cargo.toml
      - name: Run native parser and byte preservation unit probes
        run: cargo test --locked --manifest-path tools/c2pa/Cargo.toml
      - name: Real native PNG and JPEG signing round trips
        env:
          BINARY_SUFFIX: ${{ matrix.suffix }}
        run: |
          python -m pip install Pillow==12.0.0
          cargo build --release --locked --manifest-path tools/c2pa/Cargo.toml --examples
          python scripts/test_c2pa.py "tools/c2pa/target/release/workproof-c2pa$BINARY_SUFFIX" "tools/c2pa/target/release/examples/fixture$BINARY_SUFFIX" --without-network-trace --trust-probe "tools/c2pa/target/release/examples/trust_probe$BINARY_SUFFIX"
      - name: Real native PDF incremental export and explicit trust verification
        env:
          BINARY_SUFFIX: ${{ matrix.suffix }}
        run: |
          python -m pip install pypdf==6.1.3
          python scripts/test_c2pa_pdf.py "tools/c2pa/target/release/workproof-c2pa$BINARY_SUFFIX" "tools/c2pa/target/release/examples/fixture$BINARY_SUFFIX"
      - name: Collect actual isolated dependency notices
        run: python scripts/c2pa_notices.py
      - name: Package development CLI and SHA256 manifest
        env:
          PLATFORM: ${{ matrix.platform }}
          BINARY_SUFFIX: ${{ matrix.suffix }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path('.ci-c2pa-dist')
          package=root/'package'
          package.mkdir(parents=True,exist_ok=True)
          binary='workproof-c2pa'+os.environ['BINARY_SUFFIX']
          shutil.copy2(pathlib.Path('tools/c2pa/target/release')/binary,package/binary)
          shutil.copy2('LICENSE',package/'LICENSE')
          shutil.copy2('docs/C2PA.md',package/'C2PA.md')
          shutil.copy2('tools/c2pa/Cargo.lock',package/'Cargo.lock')
          shutil.copy2('test-c2pa-results.json',package/'test-c2pa-results.json')
          shutil.copytree('.ci-c2pa-notices',package/'third-party')
          (package/'VALIDATION.json').write_text(json.dumps({
              'platform':os.environ['PLATFORM'],
              'scope':'native release build, parser probes and real PNG/JPEG/PDF signing round trips',
              'pdf_strict_incremental_roundtrip_on_this_platform':True,
              'pdf_input_limits':['no encryption','no existing PDF signature','no existing C2PA','no compressed object streams'],
              'real_signing_roundtrip_on_this_platform':True,
              'network_calls_measured_on_this_platform':False,
              'public_c2pa_trust_certification':False,
              'signing_credentials_included':False,
              'distribution':'development CLI; macOS notarization and Windows signing not provided'
          },indent=2),encoding='utf-8')
          manifest=''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(package).as_posix()+'\n' for p in sorted(package.rglob('*')) if p.is_file())
          (package/'SHA256SUMS').write_text(manifest,encoding='utf-8')
          label='workproof-c2pa-'+os.environ['PLATFORM']+'-dev'
          archive=shutil.make_archive(str(root/label),'zip',package)
          archive_path=pathlib.Path(archive)
          archive_path.with_suffix('.zip.sha256').write_text(hashlib.sha256(archive_path.read_bytes()).hexdigest()+'  '+archive_path.name+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: workproof-c2pa-${{ matrix.platform }}-dev
          path: |
            .ci-c2pa-dist/workproof-c2pa-${{ matrix.platform }}-dev.zip
            .ci-c2pa-dist/workproof-c2pa-${{ matrix.platform }}-dev.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.build.conclusion == 'success' }}
        with:
          name: c2pa-${{ matrix.platform }}-lock-and-notices
          include-hidden-files: true
          path: |
            tools/c2pa/Cargo.lock
            .ci-c2pa-notices/
  png-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tools/c2pa -> target'
          cache-on-failure: true
      - name: Require reviewed isolated lockfile
        run: cargo metadata --locked --no-deps --format-version 1 --manifest-path tools/c2pa/Cargo.toml > /dev/null
      - name: Build separate SDK tool without recorder dependency changes
        id: build
        run: cargo build --locked --manifest-path tools/c2pa/Cargo.toml --all-targets
      - name: PNG and JPEG framing and byte preservation
        run: cargo test --locked --manifest-path tools/c2pa/Cargo.toml
      - name: Real C2PA signing and verification
        run: |
          sudo apt-get update && sudo apt-get install -y strace
          python -m pip install Pillow==12.0.0
          python scripts/test_c2pa.py tools/c2pa/target/debug/workproof-c2pa tools/c2pa/target/debug/examples/fixture --trust-probe tools/c2pa/target/debug/examples/trust_probe
      - name: Real PDF full and selective export, private source binding and explicit trust
        run: |
          python -m pip install pypdf==6.1.3
          python scripts/test_c2pa_pdf.py tools/c2pa/target/debug/workproof-c2pa tools/c2pa/target/debug/examples/fixture
      - name: Collect isolated dependency notices
        if: ${{ always() && steps.build.conclusion == 'success' }}
        run: python scripts/c2pa_notices.py
      - name: Package optional Linux tool with actual notices
        run: |
          cargo build --release --locked --manifest-path tools/c2pa/Cargo.toml
          python scripts/test_c2pa.py tools/c2pa/target/release/workproof-c2pa tools/c2pa/target/debug/examples/fixture --trust-probe tools/c2pa/target/debug/examples/trust_probe
          mkdir -p .ci-c2pa-dist/package/third-party
          cp tools/c2pa/target/release/workproof-c2pa .ci-c2pa-dist/package/
          cp LICENSE docs/C2PA.md .ci-c2pa-dist/package/
          cp -r .ci-c2pa-notices/. .ci-c2pa-dist/package/third-party/
          tar -czf .ci-c2pa-dist/workproof-c2pa-linux-x64-dev.tar.gz -C .ci-c2pa-dist/package .
      - uses: actions/upload-artifact@v4
        with:
          name: workproof-c2pa-linux-x64-dev
          path: .ci-c2pa-dist/workproof-c2pa-linux-x64-dev.tar.gz
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2pa-validation-and-lock
          include-hidden-files: true
          path: |
            tools/c2pa/Cargo.lock
            test-c2pa-results.json
            .ci-c2pa-notices/
