name: C2PA PNG interoperability
on:
  push:
    paths: ['tools/c2pa/**', 'crates/proof/**', 'scripts/test_c2pa.py', 'scripts/c2pa_notices.py', 'docs/licenses/c2pa-*/**', '.github/workflows/c2pa.yml']
  pull_request:
    paths: ['tools/c2pa/**', 'crates/proof/**', 'scripts/test_c2pa.py', 'scripts/c2pa_notices.py', 'docs/licenses/c2pa-*/**', '.github/workflows/c2pa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c2pa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  png-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tools/c2pa -> target'
          cache-on-failure: true
      - name: Require reviewed isolated lockfile
        run: cargo metadata --locked --no-deps --format-version 1 --manifest-path tools/c2pa/Cargo.toml > /dev/null
      - name: Build separate SDK tool without recorder dependency changes
        id: build
        run: cargo build --locked --manifest-path tools/c2pa/Cargo.toml --all-targets
      - name: PNG framing and byte preservation
        run: cargo test --locked --manifest-path tools/c2pa/Cargo.toml
      - name: Real C2PA signing and verification
        run: |
          sudo apt-get update && sudo apt-get install -y strace
          python scripts/test_c2pa.py tools/c2pa/target/debug/workproof-c2pa tools/c2pa/target/debug/examples/fixture
      - name: Collect isolated dependency notices
        if: ${{ always() && steps.build.conclusion == 'success' }}
        run: python scripts/c2pa_notices.py
      - name: Package optional Linux tool with actual notices
        run: |
          cargo build --release --locked --manifest-path tools/c2pa/Cargo.toml
          mkdir -p .ci-c2pa-dist/package/third-party
          cp tools/c2pa/target/release/workproof-c2pa .ci-c2pa-dist/package/
          cp LICENSE docs/C2PA.md .ci-c2pa-dist/package/
          cp -r .ci-c2pa-notices/. .ci-c2pa-dist/package/third-party/
          tar -czf .ci-c2pa-dist/workproof-c2pa-linux-x64-dev.tar.gz -C .ci-c2pa-dist/package .
      - uses: actions/upload-artifact@v4
        with:
          name: workproof-c2pa-linux-x64-dev
          path: .ci-c2pa-dist/workproof-c2pa-linux-x64-dev.tar.gz
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2pa-validation-and-lock
          include-hidden-files: true
          path: |
            tools/c2pa/Cargo.lock
            test-c2pa-results.json
            .ci-c2pa-notices/
