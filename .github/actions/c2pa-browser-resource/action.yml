name: Build optional local browser verifier
description: Compile and stage the locked browser SDK outside the recorder dependency graph.
runs:
  using: composite
  steps:
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: 'tools/c2pa-wasm -> target'
    - name: Build and stage the browser verification resource
      shell: bash
      run: |
        rustup target add wasm32-unknown-unknown
        cargo build --release --locked --target wasm32-unknown-unknown --manifest-path tools/c2pa-wasm/Cargo.toml
        cargo install wasm-bindgen-cli --version 0.2.130 --locked --root "$RUNNER_TEMP/workproof-c2pa-bindgen"
        "$RUNNER_TEMP/workproof-c2pa-bindgen/bin/wasm-bindgen" tools/c2pa-wasm/target/wasm32-unknown-unknown/release/workproof_c2pa_wasm.wasm --target web --out-dir tools/c2pa-wasm/pkg
        python scripts/c2pa_notices.py --workspace c2pa-wasm
        node tools/c2pa-wasm/stage.mjs
