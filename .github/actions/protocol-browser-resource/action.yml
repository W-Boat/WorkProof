name: Build the ordinary certificate browser verifier
description: Stage the locked protocol Wasm, labelled public demos and exact build provenance on every supported runner.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/wasm-bindgen-cli
      id: bindgen
      with:
        version: '0.2.105'
    - name: Build and stage the shared proof and structure verifier
      shell: python
      env:
        BINDGEN_BINARY: ${{ steps.bindgen.outputs.binary }}
      run: |
        import hashlib,json,os,pathlib,subprocess
        def run(*args): subprocess.run(list(map(str,args)),check=True)
        output=pathlib.Path('apps/verifier/public/wasm')
        run('rustup','target','add','wasm32-unknown-unknown')
        run('cargo','build','--locked','-p','workproof-protocol','--release','--target','wasm32-unknown-unknown')
        run(os.environ['BINDGEN_BINARY'],'target/wasm32-unknown-unknown/release/workproof_protocol.wasm','--target','web','--out-dir',output)
        run('cargo','run','--locked','-p','workproof-protocol','--example','generate_fixture','--','apps/verifier/public/demo')
        files=[]
        for name in ['workproof_protocol.js','workproof_protocol_bg.wasm','workproof_protocol.d.ts','workproof_protocol_bg.wasm.d.ts']:
            source=output/name
            if source.is_symlink() or not source.is_file():raise RuntimeError('Missing generated protocol browser resource: '+name)
            data=source.read_bytes();files.append({'name':name,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
        (output/'BUILD-INFO.json').write_text(json.dumps({'protocol':'workproof-browser-build/1','source_commit':os.environ['GITHUB_SHA'],'build_run':os.environ['GITHUB_RUN_ID'],'wasm_bindgen_version':'0.2.105','files':files},indent=2)+'\n',encoding='utf-8')
